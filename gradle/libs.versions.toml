[versions]
junit5 = "6.1.3"
junit4 = "4.13.2"
opentest4j = "1.3.0"
junit-platform-launcher = "6.1.3"
detekt = "2.0.0-alpha.6"
detekt-compose-rules = "0.6.6"
kotlinx-serialization = "1.9.0"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform-launcher" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
opentest4j = { module = "org.opentest4j:opentest4j", version.ref = "opentest4j" }
detekt-rules-ktlint-wrapper = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }
detekt-compose-rules = { module = "io.nlopez.compose.rules:detekt", version.ref = "detekt-compose-rules" }
kotlinx-serialization-core-jvm = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core-jvm", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json-jvm = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm", version.ref = "kotlinx-serialization" }
